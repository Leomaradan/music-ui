name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (story tests)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests (jsdom) and story tests (Storybook play functions + a11y, in Chromium).
      - run: pnpm test
      - name: Story test failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: story-screenshots
          path: '**/__screenshots__/**'
          if-no-files-found: ignore
      - run: pnpm build-storybook
      - run: pnpm build

  integration:
    name: Integration tests (Navidrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg (sample music)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm navidrome:music
      - name: Start Navidrome (docker/compose.dev.yml)
        run: docker compose -f docker/compose.dev.yml up -d
      - name: Wait for Navidrome
        run: timeout 90 sh -c 'until curl -sf http://localhost:4533/ping >/dev/null; do sleep 1; done'
      - run: pnpm navidrome:setup
      - run: pnpm test:integration
      - name: Navidrome logs
        if: failure()
        run: docker compose -f docker/compose.dev.yml logs

  docker:
    name: Docker image
    needs: [check, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: music-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (container starts and becomes healthy)
        run: |
          docker run -d --name music-ui -p 3000:3000 \
            -e SUBSONIC_URL=http://127.0.0.1:9 -e SUBSONIC_USER=ci -e SUBSONIC_PASSWORD=ci \
            music-ui:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' music-ui)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' music-ui | grep -qx healthy
          curl -sf http://localhost:3000/ >/dev/null
          # Navidrome is unreachable here: the app reports itself degraded, but runs.
          curl -sf http://localhost:3000/api/health | grep -q '"status":"degraded"'
          docker exec music-ui id -u | grep -qx 99
      - name: Container logs
        if: failure()
        run: docker logs music-ui
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
